server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: postgres
    source: "user=postgres password=postgres host=localhost port=15432 dbname=kratos_project sslmode=disable"
  redis:
    addr: 127.0.0.1:16379
    read_timeout: 0.2s
    write_timeout: 0.2s
