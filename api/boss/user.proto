syntax = "proto3";

package boss;
import "base/base.proto";
import "google/protobuf/wrappers.proto";

option go_package = "api/boss;boss";

message UserReply{
  google.protobuf.StringValue  id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.Int32Value age = 3;
  google.protobuf.StringValue email = 4;
}

message CreateUserRequest {
  google.protobuf.StringValue name = 1;
  google.protobuf.Int32Value age = 2;
  google.protobuf.StringValue email = 3;
  google.protobuf.StringValue password = 4;
}
message CreateUserReply {
  base.ResultResp r = 1;
  UserReply data = 2;
}

message UpdateUserRequest {
  google.protobuf.StringValue  id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.Int32Value age = 3;
  google.protobuf.StringValue email = 4;
}
message UpdateUserReply {
  base.ResultResp r = 1;
  UserReply data = 2;
}

message DeleteUserRequest {
  google.protobuf.StringValue  id = 1;
}
message DeleteUserReply {
  base.ResultResp r = 1;
}

message GetUserRequest {
  google.protobuf.StringValue  id = 1;

}
message GetUserReply {
  base.ResultResp r = 1;
  UserReply data = 2;
}

message QueryUserRequest{
  google.protobuf.StringValue name = 1;
  google.protobuf.Int32Value age = 2;
}

message ListUserRequest {
  base.SortReq sort = 1;
  QueryUserRequest query = 2;
}
message ListUserReply {
  base.ResultResp r = 1;
  repeated UserReply data = 2;
}

message PageUserRequest {
  base.PageReq page = 1;
  base.SortReq sort = 2;
  QueryUserRequest query = 3;
}

message PageUserReply{
  base.ResultResp r = 1;
  base.PageResp page = 2;
  repeated UserReply data = 3;
}